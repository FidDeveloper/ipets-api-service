resolver 127.0.0.11 valid=5s;
upstream auth_backend { zone auth_backend 64k; server auth-service:8080 resolve; }
upstream pet_backend { zone pet_backend 64k; server pet-service:8080 resolve; }
upstream document_backend { zone document_backend 64k; server document-service:8080 resolve; }
upstream notification_backend { zone notification_backend 64k; server notification-service:8080 resolve; }
server {
 listen 80;
 client_max_body_size 21m;
 proxy_read_timeout 60s;
 # Service-to-service endpoints are never public.
 location ~ ^/[a-z]+/internal/ { return 404; }
 location /auth/ { proxy_pass http://auth_backend/; proxy_set_header Host $host; }
 location /pet/ { proxy_pass http://pet_backend/; proxy_set_header Host $host; }
 location /document/ { proxy_pass http://document_backend/; proxy_set_header Host $host; proxy_request_buffering off; }
 location /notification/ { proxy_pass http://notification_backend/; proxy_set_header Host $host; }
 location / { return 404; }
}
