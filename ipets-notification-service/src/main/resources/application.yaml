spring:
  application:
    name: ipets-notification-service
  datasource:
    url: ${IPETS_DB_URL:jdbc:mysql://mysql:3306/notification_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${IPETS_DB_USER:notification}
    password: ${IPETS_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  flyway:
    user: ${IPETS_DB_MIGRATOR_USER:notification_migrator}
    password: ${IPETS_DB_MIGRATOR_PASSWORD:}
server:
  shutdown: graceful
  error:
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
ipets:
  jwt:
    issuer: ${IPETS_JWT_ISSUER:https://localhost.invalid}
    audience: ipets-api
    jwks-uri: ${IPETS_JWT_JWKS_URI:}
  internal-token: ${IPETS_INTERNAL_TOKEN:}
  pet-service-url: ${IPETS_PET_SERVICE_URL:http://pet-service:8080}
