name: notification service
on:
  push:
    branches: [develop, main]
    paths: ['ipets-notification-service/**', '.github/workflows/notification.yaml']
  pull_request:
    paths: ['ipets-notification-service/**', '.github/workflows/notification.yaml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode verify
        working-directory: ipets-notification-service
  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./ipets-notification-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/fiddeveloper/ipets-api-service/notification:${{ github.sha }}
            ghcr.io/fiddeveloper/ipets-api-service/notification:${{ github.ref_name }}
